<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Café-Tisch mit Kaffee und Croissant unter einer gestreiften Markise">
  <rect width="400" height="260" fill="#f8e6da"/>
  <!-- Markise -->
  <g>
    <rect x="0" y="0" width="400" height="46" fill="#fbf8f3"/>
    <g fill="#d9734e">
      <rect x="0" y="0" width="40" height="46"/>
      <rect x="80" y="0" width="40" height="46"/>
      <rect x="160" y="0" width="40" height="46"/>
      <rect x="240" y="0" width="40" height="46"/>
      <rect x="320" y="0" width="40" height="46"/>
    </g>
    <path d="M0 46 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 q20 18 40 0 z" fill="#d9734e"/>
  </g>
  <!-- Tisch -->
  <ellipse cx="200" cy="200" rx="160" ry="38" fill="#fbf8f3"/>
  <ellipse cx="200" cy="196" rx="160" ry="36" fill="#ffffff"/>
  <!-- Tasse -->
  <g transform="translate(140 130)">
    <ellipse cx="30" cy="66" rx="52" ry="12" fill="#e7d3c6"/>
    <path d="M0 10 h60 v30 a30 26 0 0 1 -60 0 z" fill="#1f4e79"/>
    <ellipse cx="30" cy="10" rx="30" ry="7" fill="#6b3f2a"/>
    <path d="M60 18 a14 12 0 1 1 0 22" fill="none" stroke="#1f4e79" stroke-width="6"/>
    <g fill="none" stroke="#b5838d" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M18 -4 q-8 -12 0 -24"/>
      <path d="M34 -6 q-8 -12 0 -24"/>
    </g>
  </g>
  <!-- Croissant -->
  <g transform="translate(230 165)">
    <path d="M0 20 C10 -8 70 -8 80 20 C66 30 14 30 0 20 Z" fill="#e0a55b"/>
    <path d="M20 4 L26 26 M40 0 L40 28 M60 4 L54 26" stroke="#b97a35" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Blumenvase -->
  <g transform="translate(300 120)">
    <rect x="0" y="30" width="18" height="40" rx="8" fill="#3a7ca5" opacity="0.8"/>
    <path d="M9 30 V0" stroke="#8a9a5b" stroke-width="3"/>
    <circle cx="9" cy="0" r="9" fill="#e8b4a6"/>
    <circle cx="0" cy="12" r="6" fill="#f4c07a"/>
  </g>
</svg>
