<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Sprechblasen mit Bonjour und Merci">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3eff5"/>
      <stop offset="1" stop-color="#cfe3ee"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <circle cx="330" cy="50" r="70" fill="#f4c07a" opacity="0.35"/>
  <circle cx="60" cy="230" r="80" fill="#3a7ca5" opacity="0.12"/>
  <!-- Blase 1 -->
  <g transform="translate(40 50)">
    <rect width="190" height="80" rx="40" fill="#1f4e79"/>
    <path d="M40 76 L30 104 L70 78 Z" fill="#1f4e79"/>
    <text x="95" y="52" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="32" font-style="italic" fill="#fbf8f3">Bonjour</text>
  </g>
  <!-- Blase 2 -->
  <g transform="translate(190 140)">
    <rect width="170" height="70" rx="35" fill="#fbf8f3"/>
    <path d="M130 66 L148 94 L108 68 Z" fill="#fbf8f3"/>
    <text x="85" y="46" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="30" font-style="italic" fill="#d9734e">Merci !</text>
  </g>
  <!-- Herzen -->
  <path d="M300 118 c-6 -10 -22 -6 -18 6 c3 8 18 16 18 16 s15 -8 18 -16 c4 -12 -12 -16 -18 -6z" fill="#e8b4a6"/>
  <path d="M70 180 c-4 -7 -15 -4 -12 4 c2 5 12 11 12 11 s10 -6 12 -11 c3 -8 -8 -11 -12 -4z" fill="#d9734e" opacity="0.7"/>
</svg>
