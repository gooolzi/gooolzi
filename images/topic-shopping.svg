<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Kleid auf einem Bügel neben Einkaufstaschen">
  <rect width="400" height="260" fill="#f3e3e3"/>
  <circle cx="80" cy="60" r="90" fill="#e8b4a6" opacity="0.35"/>
  <!-- Stange -->
  <path d="M40 40 h200" stroke="#d9a441" stroke-width="5" stroke-linecap="round"/>
  <!-- Kleid -->
  <g transform="translate(140 40)">
    <path d="M0 0 q0 -12 10 -12" fill="none" stroke="#6b3f2a" stroke-width="3"/>
    <path d="M-30 18 L0 6 L30 18" fill="none" stroke="#6b3f2a" stroke-width="3"/>
    <path d="M-18 18 h36 l-4 40 l44 130 h-116 l44 -130 z" fill="#3a7ca5"/>
    <path d="M-22 58 h44" stroke="#fbf8f3" stroke-width="5"/>
    <g fill="#fbf8f3" opacity="0.75">
      <circle cx="-20" cy="110" r="4"/><circle cx="8" cy="130" r="4"/><circle cx="30" cy="160" r="4"/>
      <circle cx="-34" cy="160" r="4"/><circle cx="-2" cy="90" r="4"/><circle cx="10" cy="175" r="4"/>
    </g>
  </g>
  <!-- Taschen -->
  <g transform="translate(250 120)">
    <path d="M20 10 q0 -30 25 -30 t25 30" fill="none" stroke="#1f4e79" stroke-width="5"/>
    <rect x="0" y="10" width="90" height="100" rx="6" fill="#fbf8f3"/>
    <text x="45" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#d9734e">Paris</text>
  </g>
  <g transform="translate(320 160)">
    <path d="M12 8 q0 -22 18 -22 t18 22" fill="none" stroke="#b8563a" stroke-width="4"/>
    <rect x="0" y="8" width="60" height="70" rx="5" fill="#d9734e"/>
  </g>
</svg>
